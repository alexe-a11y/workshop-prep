<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workshop prep — protected</title>
<style>
  :root {
    --bg: #faf6ee; --surface: #ffffff; --text: #27211a; --muted: #77705f;
    --border: #eae1cd; --accent: #da291c; --gold: #ffc72c; --bad: #b45309; --bad-soft: #fdf1e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191411; --surface: #241d18; --text: #f2ece2; --muted: #a99f8d;
      --border: #3e342a; --accent: #f0554a; --bad: #fbab5e; --bad-soft: #3a2a15;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .stripe { height: 6px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 55%, var(--gold) 55%, var(--gold) 100%); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 34px 30px; max-width: 400px; width: 100%; text-align: center;
  }
  .lock { font-size: 2rem; }
  h1 { font-size: 1.15rem; margin: 10px 0 6px; letter-spacing: -0.01em; }
  p { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 1rem; font-family: inherit;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); text-align: center;
  }
  input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button {
    width: 100%; margin-top: 12px; padding: 11px; font-size: 1rem; font-weight: 650;
    font-family: inherit; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err {
    display: none; margin-top: 12px; padding: 9px 12px; font-size: 0.85rem;
    background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); border-radius: 9px;
  }
  .err.show { display: block; }
  .foot { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 14px; }
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <form class="card" id="f">
    <div class="lock">&#128274;</div>
    <h1>This page is protected</h1>
    <p>Enter the password from Alex&rsquo;s email to open the workshop prep page.</p>
    <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="Password">
    <button type="submit" id="go">Open</button>
    <div class="err" id="err">That password didn&rsquo;t work &mdash; check the email or contact alex.e@wonderful.ai</div>
  </form>
</main>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: b(P.salt), iterations: P.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b(P.iv)}, key, b(P.ct));
  const html = new TextDecoder().decode(pt);
  try { sessionStorage.setItem('gatepw', pass); } catch (e) {}
  document.open();
  document.write(html);
  document.close();
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  err.classList.remove('show');
  go.disabled = true; go.textContent = 'Opening…';
  try {
    await tryOpen(document.getElementById('pw').value.trim());
  } catch (e) {
    go.disabled = false; go.textContent = 'Open';
    err.classList.add('show');
    document.getElementById('pw').select();
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('gatepw'); } catch (e) {}
  if (saved) { try { await tryOpen(saved); } catch (e) {} }
})();
